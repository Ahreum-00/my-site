<body>
  <header>
    <h1>이아름의 페이지</h1>
    <nav>
      <ul>
        <li><a href="index.html#IT">처음</a></li>
        <li><a href="about.html">자기소개</a></li>
        <li><a href="courses.html">수강신청</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h2>자기소개</h2>
    <p>
      <a href="about.html#contact">연락하기로 바로 가기</a>
    </p>
      <p>웹 개발을 배우는 수강생입니다.</p>
      <ol>
        <li>배우고 싶은 것</li>
        <li>이게 더 어려워요</li>
        <li>뭐가 있을까요</li>
      </ol>
      <p>
        <a href="index.html/#IT"
           target="_blank">IT 교육센터</a>
      </p>
    </section>
    <section id="contact">
<h2>연락하기</h2>
  <form action="https://httpbin.org/post" method="post">
    <P>
      <label for="name">이름</label>
      <input type="text" id="name" name="name" required>
    </P>
    <p>
      <label for="email">이메일</label>
      <input type="email" id="email" name="email" required>
    </P>
    <p>
      <label for="course">문의종류</label>
        <select id="course" name="course" >
          <option value="null">고르시오</option>
          <option value="project">프로젝트 제안</option>
          <option value="css">CSS</option>        
        </select>
    </p>
    <p>
      <label for="memo">내용</label><br>
      <textarea id="memo" name="memo" rows="8" cols="50"></textarea>
    </p>
    <button type="submit">보내기</button>
    <P>※ 연습용 폼입니다. 입력한 내용은 연습 서버(httpbin.org)로만 전송됩니다.</P>
  </form>
  </section>
  </main>
  <footer>

  </footer>
